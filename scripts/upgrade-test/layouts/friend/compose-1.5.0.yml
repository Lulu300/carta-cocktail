# compose-1.4.0.yml after step "Before upgrading 3" of the v1.5.0 notes ("update the compose file
# to the v1.5.0 version, keeping your own changes"):
# - photos mounted on /uploads: the same folder is mounted on /app/uploads instead;
# - secrets in an env_file: they stay there, and the JWT_SECRET and ADMIN_PASSWORD lines of the
#   v1.5.0 file are not copied (ADMIN_EMAIL is already set in environment by this setup);
# - the new ADMIN_RESET_PASSWORD and UPLOAD_DIR lines are added as they are.
# Other own changes (bind mount of the data folder, external network) are kept.
services:
  carta-cocktail-backend:
    image: {{BACKEND_IMAGE}}
    platform: {{BACKEND_PLATFORM}}
    container_name: {{PROJECT}}-backend
    env_file:
      - carta-cocktail.env
    environment:
      - DATABASE_URL=file:/app/data/carta_cocktail.db
      - ADMIN_EMAIL={{ADMIN_EMAIL}}
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD:-false}
      - PORT=3001
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - swag
    ports:
      - "127.0.0.1::3001"
    restart: unless-stopped

  carta-cocktail-frontend:
    image: {{FRONTEND_IMAGE}}
    platform: {{FRONTEND_PLATFORM}}
    container_name: {{PROJECT}}-frontend
    environment:
      - BACKEND_HOST=carta-cocktail-backend
    depends_on:
      - carta-cocktail-backend
    networks:
      - swag
    ports:
      - "127.0.0.1::80"
    restart: unless-stopped
networks:
  swag:
    external: true
    name: {{PROJECT}}-swag
