services:
  carta-cocktail-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Local build: the API stays reachable from this host only, for debugging.
    # The browser goes through nginx, on the frontend port.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - DATABASE_URL=file:/app/data/carta_cocktail.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@carta.local}
      # Only needed to create the admin on first start, or with ADMIN_RESET_PASSWORD=true
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD:-false}
      - PORT=3001
      - UPLOAD_DIR=/app/uploads
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    healthcheck:
      # busybox wget, in the node alpine image; /api/health runs a query on the database
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers the start sequence of the entrypoint: database backup, migrations and seed
      start_period: 60s
    restart: unless-stopped

  carta-cocktail-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - BACKEND_HOST=carta-cocktail-backend
    depends_on:
      carta-cocktail-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
  uploads:
