services:
  carta-cocktail-backend:
    image: ghcr.io/lulu300/carta-cocktail/backend:latest
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:/app/data/carta_cocktail.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@carta.local}
      # Only needed to create the admin on first start, or with ADMIN_RESET_PASSWORD=true
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD:-false}
      - PORT=3001
      - UPLOAD_DIR=/app/uploads
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped

  carta-cocktail-frontend:
    image: ghcr.io/lulu300/carta-cocktail/frontend:latest
    ports:
      - "80:80"
    environment:
      - BACKEND_HOST=carta-cocktail-backend
    depends_on:
      - carta-cocktail-backend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
