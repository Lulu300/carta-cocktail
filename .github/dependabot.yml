# Dependabot version updates (task D-06 of docs/plan).
#
# Version update PRs target `develop`, like any other change. Security update
# PRs ignore this file's per-ecosystem options and always target the default
# branch (`main`); they only exist once "Dependabot security updates" is
# enabled in the repository settings.
#
# Ignored majors:
# - those handled by a plan task: Prisma and better-sqlite3 (D-47; the three
#   Prisma packages move together and better-sqlite3 stays in the range of
#   @prisma/adapter-better-sqlite3), TypeScript (F-07);
# - Node and @types/node, which follow the Node major of the images and CI
#   (an LTS switch is done by hand).
# Pre-releases are never proposed while the current version is a stable one,
# even when the `latest` dist-tag points to one (as `prisma` 8.0.0-rc does).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Europe/Paris }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, backend]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/adapter-better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Europe/Paris }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, frontend]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Dependabot only updates a `FROM` with a literal tag, not one built from an
  # ARG: the Dockerfiles must keep literal tags.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Europe/Paris }
    commit-message: { prefix: "chore(docker)" }
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
