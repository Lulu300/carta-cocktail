# Dependabot version updates (task D-06 of docs/plan).
#
# Version update PRs target `develop`, like any other change. Security update
# PRs ignore this file's per-ecosystem options and always target the default
# branch (`main`); they only exist once "Dependabot security updates" is
# enabled in the repository settings.
#
# Majors handled by dedicated plan tasks are ignored: Prisma (C-15),
# TypeScript (F-07) and Node (an LTS switch is done by hand).
version: 2
updates:
  # npm: `open-pull-requests-limit: 0` disables version updates while phase B
  # of the plan is in progress. Phase B upgrades the dependencies in planned
  # batches and allows only one task at a time on a package's lockfile, so
  # Dependabot PRs would conflict with those tasks. Security updates are not
  # subject to this limit. Task D-21 raises it to 5 once phase B is done.
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Europe/Paris }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, backend]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Europe/Paris }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, frontend]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Dependabot only updates a `FROM` with a literal tag, not one built from an
  # ARG: the Dockerfiles must keep literal tags.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Europe/Paris }
    commit-message: { prefix: "chore(docker)" }
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
