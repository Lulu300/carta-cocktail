name: Smoke

# Starts the stack of docker-compose.yml (images built from the pull request) and runs
# scripts/smoke/smoke.sh through nginx: login, photo upload, persistence after a
# recreation of the backend, backup export. Separate from ci.yml so that it can be
# made a required check on its own once it has proven stable.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: carta-smoke

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Throwaway values: compose reads .env for the backend, the script for the login
      - name: Test secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=smoke@carta.local"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: set -a && . ./.env && set +a && ./scripts/smoke/smoke.sh

      - name: Collect container logs
        if: failure()
        run: |
          docker compose ps --all > compose.log
          docker compose logs --no-color --timestamps >> compose.log

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

      - name: Remove the stack and its volumes
        if: always()
        run: docker compose down -v --remove-orphans
