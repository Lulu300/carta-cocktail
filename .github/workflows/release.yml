name: Release

# Release model (see README.md "CI/CD" and UPGRADING.md):
# - vX.Y.Z-rc.N: pre-release, tagged on develop. Publishes :X.Y.Z-rc.N images
#   (latest is not moved) and a GitHub Release marked as pre-release.
# - vX.Y.Z: final release, tagged on main. Publishes :X.Y.Z, :X.Y, :X and
#   :latest images and a normal GitHub Release.
# Images are built for linux/amd64 and linux/arm64, with SBOM and provenance,
# only after the full CI of the tagged commit has passed.
# Push the branch before the tag: the branch rule reads origin/<branch>.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Everything that can refuse a tag runs here, before any image is pushed.
  verify:
    name: Verify tag and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.path }}
      prev_tag: ${{ steps.prev.outputs.tag }}

    steps:
      # fetch-depth 0 brings origin/main, origin/develop and every tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse the tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NUMBER='(0|[1-9][0-9]*)'
          if [[ ! "$VERSION" =~ ^$NUMBER\.$NUMBER\.$NUMBER(-rc\.$NUMBER)?$ ]]; then
            echo "::error::Invalid tag $GITHUB_REF_NAME: expected vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          if [[ "$VERSION" == *-rc.* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: version $VERSION, pre-release: $PRERELEASE"

      - name: A final tag must be reachable from main, a pre-release from develop
        env:
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # Peel the tag: for an annotated tag the ref points to a tag object, not a commit
          COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          if [ "$PRERELEASE" = true ]; then
            BRANCH=develop
          else
            BRANCH=main
          fi
          if ! git merge-base --is-ancestor "$COMMIT" "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME ($COMMIT) is not reachable from origin/$BRANCH. Push the branch before the tag, and tag pre-releases on develop and final releases on main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME ($COMMIT) is reachable from origin/$BRANCH"

      - name: Release notes file must exist and be valid
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # A pre-release without its own notes file uses the target version's file
          NOTES="docs/releases/v$VERSION.md"
          if [ "$PRERELEASE" = true ] && [ ! -f "$NOTES" ]; then
            NOTES="docs/releases/v${VERSION%%-*}.md"
          fi
          if [ ! -f "$NOTES" ]; then
            if [ "$PRERELEASE" = true ]; then
              echo "::error::Missing release notes: neither docs/releases/v$VERSION.md nor docs/releases/v${VERSION%%-*}.md exists (copy docs/releases/TEMPLATE.md)"
            else
              echo "::error::Missing release notes: docs/releases/v$VERSION.md (copy docs/releases/TEMPLATE.md)"
            fi
            exit 1
          fi

          # Both cases would pass the yq checks below, and the release body would
          # then show the raw front matter: yq reads a file without the opening
          # --- as plain YAML, and a CRLF file's first line is "---\r"
          if grep -q $'\r' "$NOTES"; then
            echo "::error file=$NOTES::The notes file has CR characters: use LF line endings"
            exit 1
          fi
          if [ "$(head -n 1 "$NOTES")" != "---" ]; then
            echo "::error file=$NOTES::The notes file must start with a --- line (front matter)"
            exit 1
          fi

          # The front matter must name the version of the file it is in
          EXPECTED=$(basename "$NOTES" .md)
          EXPECTED="${EXPECTED#v}"
          if ! FOUND=$(yq --front-matter=extract '.version' "$NOTES"); then
            echo "::error file=$NOTES::The front matter is not valid YAML"
            exit 1
          fi
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error file=$NOTES::Front matter version is '$FOUND', expected '$EXPECTED'"
            exit 1
          fi

          # Shape read by the in-app upgrade guide: breaking is a boolean,
          # required_actions a list of { when: before|after, action: text }
          VALID=$(yq --front-matter=extract '
            (.breaking | tag) == "!!bool" and
            (.required_actions | tag) == "!!seq" and
            ([.required_actions[] | select((.when == "before" or .when == "after") and (.action | tag) == "!!str" and .action != "")] | length) == (.required_actions | length)
          ' "$NOTES")
          if [ "$VALID" != true ]; then
            echo "::error file=$NOTES::The front matter needs breaking (true or false) and required_actions (a list of { when: before|after, action: \"...\" }, or [])"
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "Release notes: $NOTES"

      - name: Previous tag
        id: prev
        env:
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # Newest first. versionsort.suffix=- sorts v1.5.0-rc.N before v1.5.0.
          # The version order is used, not git describe: the last final tag is a
          # merge commit on main, which is not always an ancestor of develop.
          TAGS=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname)
          if [ "$PRERELEASE" = false ]; then
            # A final release lists the changes since the previous final release
            TAGS=$(printf '%s\n' "$TAGS" | grep -v -- '-' || true)
          fi
          PREV_TAG=$(printf '%s\n' "$TAGS" | awk -v tag="$GITHUB_REF_NAME" 'found { print; exit } $0 == tag { found = 1 }')
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV_TAG:-none}"

  # The full CI of the tagged commit (tests, lint, audit, Docker builds): no
  # image is pushed unless it passes. ci.yml keeps its own concurrency group,
  # named after this workflow ("ci-Release-<sha>"): never reuse it here.
  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push ${{ matrix.service }} image
    needs: [verify, ci]
    runs-on: ubuntu-latest
    # buildx pushes the SBOM and provenance attestations with the image: no
    # id-token or attestations permission is needed.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 is built under emulation. The Dockerfiles compile on the runner's
      # own platform, so QEMU only runs the arm64 runtime stages (backend
      # runtime dependencies with their native binaries, base image setup).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # X.Y.Z for every tag; X.Y and X for a final release only (the action
      # gives a pre-release its {{version}} tag alone). latest follows the
      # verify job: only a final release moves it.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.service }}
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # The cache is read from the scope written by the CI pushes (amd64 only,
      # rewritten at each push) and from the release scope, which keeps the
      # arm64 layers from one release to the next.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version of the running application (APP_VERSION in the backend,
          # VITE_APP_VERSION in the frontend build)
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=gha,scope=${{ matrix.service }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-release

  github-release:
    name: Create GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the release body
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.verify.outputs.notes }}
          VERSION: ${{ needs.verify.outputs.version }}
          PREV_TAG: ${{ needs.verify.outputs.prev_tag }}
        run: |
          IMAGE_BASE="$REGISTRY/${GITHUB_REPOSITORY,,}"
          ARGS=(-f "tag_name=$GITHUB_REF_NAME")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f "previous_tag_name=$PREV_TAG")
          fi
          PULL_REQUESTS=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body)

          {
            # Notes file without its front matter: Summary, Changes, Required actions
            awk 'NR == 1 && $0 == "---" { in_front_matter = 1; next }
                 in_front_matter && $0 == "---" { in_front_matter = 0; next }
                 !in_front_matter' "$NOTES"
            echo
            echo "## Pull requests"
            echo
            # Drop GitHub's own top heading and nest its other sections under ours
            printf '%s\n' "$PULL_REQUESTS" | sed -e "/^## What's Changed$/d" -e 's/^## /### /'
            echo
            echo "## Docker images"
            echo
            echo '```bash'
            echo "docker pull $IMAGE_BASE/backend:$VERSION"
            echo "docker pull $IMAGE_BASE/frontend:$VERSION"
            echo '```'
          } > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
