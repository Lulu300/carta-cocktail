name: E2E

# Playwright journeys (e2e/) in Chromium, against the stack of docker-compose.yml built from the
# pull request: the real nginx, backend and SQLite. The Vitest suites mock the API and the smoke
# test only drives curl, so nothing else runs the interface against a real backend.
# Not a required check yet: it becomes one after a few stable weeks (docs/plan/tasks/F-04).
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: carta-e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Throwaway values, as in smoke.yml: compose reads .env for the backend, and the
      # Playwright config reads the same file for the admin sign-in
      - name: Test secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=e2e@carta.local"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Install the tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck and check the format of the tests
        working-directory: e2e
        run: |
          npm run typecheck
          npm run format:check

      - name: Run the journeys
        working-directory: e2e
        run: npm test

      # The report holds the trace and the screenshot of each failed test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Collect container logs
        if: failure()
        run: |
          docker compose ps --all > compose.log
          docker compose logs --no-color --timestamps >> compose.log

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

      - name: Remove the stack and its volumes
        if: always()
        run: docker compose down -v --remove-orphans
