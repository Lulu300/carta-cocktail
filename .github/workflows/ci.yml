name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lets the release workflow run this CI before it pushes images (D-05)
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its running CI. Pushes to main or
# develop get one group per commit, so a later push never cancels the CI of an
# earlier commit. github.workflow is the caller's name in a call ("Release"),
# so the release's CI never waits behind, or is cancelled by, the CI of the
# push on the same commit. The release workflow must keep its own group name.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The postinstall script generates the Prisma client
      - run: npm ci

      - name: Check that migrations match the Prisma schema
        run: npm run db:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Tests of every CI script in .github/scripts (delta coverage, bundle budget).
      - name: CI script tests
        run: node --test '../.github/scripts/*.test.mjs'

      # src/test/setup.ts sets the test environment (database, secrets, admin)
      - name: Tests with coverage
        run: npm run test:coverage

      # The --ignore globs mirror coverage.exclude in backend/vitest.config.ts:
      # keep both lists in sync, or excluded files will count as 0% here.
      - name: Delta coverage check (80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          node ../.github/scripts/delta-coverage.mjs
          --coverage coverage/coverage-final.json
          --threshold 80
          --base "$BASE_REF"
          --scope backend/src/
          --ignore 'backend/src/test/**'
          --ignore 'backend/src/index.ts'
          --ignore 'backend/src/scripts/seed.ts'
          --ignore 'backend/src/scripts/check-integrity.ts'

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # tsconfig.json only holds project references ("files": []): without -b,
      # tsc checks no file at all. Both referenced projects set noEmit.
      - name: TypeScript check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # Hidden source maps tell the bundle budget which modules each chunk holds.
      # They do not change the emitted JavaScript, and the Docker image build
      # (plain `npm run build`) does not produce them.
      - name: Build
        run: npm run build -- --sourcemap hidden

      # Budget: 132.74 kB gzip measured on 2026-10-11 (entry + modulepreload
      # chunks) + ~5% margin. Raise it only with a reason written in the PR.
      # History: 133 kB (D-14, 126.31 kB measured); 140 kB (E-11: the public
      # pages now use TanStack's useQuery, plus skeletons, error states and
      # section navigation).
      - name: Bundle budget (initial load of the public menu)
        run: node ../.github/scripts/bundle-budget.mjs dist 140

      - name: Tests with coverage
        run: npm run test:coverage

      # The --ignore globs mirror coverage.exclude in frontend/vitest.config.ts:
      # keep both lists in sync, or excluded files will count as 0% here.
      - name: Delta coverage check (80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          node ../.github/scripts/delta-coverage.mjs
          --coverage coverage/coverage-final.json
          --threshold 80
          --base "$BASE_REF"
          --scope frontend/src/
          --ignore 'frontend/src/test/**'
          --ignore 'frontend/src/main.tsx'
          --ignore 'frontend/src/i18n/**'
          --ignore 'frontend/src/types/**'

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # Builds both images without pushing them, so a broken Dockerfile fails the
  # pull request instead of the release. Same cache scopes as the release
  # workflow. Only pushes write the cache: pull requests read the cache of
  # their base branch, and writing their own layers would evict it (10 GB quota).
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: false
          # The image is not used afterwards: keep the result in the build cache only
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}
