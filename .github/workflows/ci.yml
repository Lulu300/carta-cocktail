name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check that migrations match the Prisma schema
        run: npm run db:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Tests of every CI script in .github/scripts (delta coverage, bundle budget).
      - name: CI script tests
        run: node --test '../.github/scripts/*.test.mjs'

      - name: Tests with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: file:./prisma/test.db
          JWT_SECRET: test-secret
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: testpass123
          NODE_ENV: test

      # The --ignore globs mirror coverage.exclude in backend/vitest.config.ts:
      # keep both lists in sync, or excluded files will count as 0% here.
      - name: Delta coverage check (80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          node ../.github/scripts/delta-coverage.mjs
          --coverage coverage/coverage-final.json
          --threshold 80
          --base "$BASE_REF"
          --scope backend/src/
          --ignore 'backend/src/test/**'
          --ignore 'backend/src/index.ts'

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Hidden source maps tell the bundle budget which modules each chunk holds.
      # They do not change the emitted JavaScript, and the Docker image build
      # (plain `npm run build`) does not produce them.
      - name: Build
        run: npm run build -- --sourcemap hidden

      # Budget: 126.29 kB gzip measured on 2026-10-11 (entry + modulepreload
      # chunks) + ~5% margin. Raise it only with a reason written in the PR.
      - name: Bundle budget (initial load of the public menu)
        run: node ../.github/scripts/bundle-budget.mjs dist 133

      - name: Tests with coverage
        run: npm run test:coverage

      # The --ignore globs mirror coverage.exclude in frontend/vitest.config.ts:
      # keep both lists in sync, or excluded files will count as 0% here.
      - name: Delta coverage check (80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          node ../.github/scripts/delta-coverage.mjs
          --coverage coverage/coverage-final.json
          --threshold 80
          --base "$BASE_REF"
          --scope frontend/src/
          --ignore 'frontend/src/test/**'
          --ignore 'frontend/src/main.tsx'
          --ignore 'frontend/src/i18n/**'
          --ignore 'frontend/src/types/**'

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
