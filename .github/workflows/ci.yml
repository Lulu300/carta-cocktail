name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lets the release workflow run this CI before it pushes images (D-05)
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its running CI. Pushes to main or
# develop get one group per commit, so a later push never cancels the CI of an
# earlier commit. github.workflow is the caller's name in a call ("Release"),
# so the release's CI never waits behind, or is cancelled by, the CI of the
# push on the same commit. The release workflow must keep its own group name.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The postinstall script generates the Prisma client
      - run: npm ci

      # The Prisma CLI is a runtime dependency (the container applies the
      # migrations at startup): its advisories count here. A new advisory is
      # fixed by an upgrade or an override, never by lowering the threshold.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check that migrations match the Prisma schema
        run: npm run db:check

      - name: TypeScript check (src and config files)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Tests of every CI script in .github/scripts (delta coverage, bundle budget, CSS media ranges).
      - name: CI script tests
        run: node --test '../.github/scripts/*.test.mjs'

      # src/test/setup.ts sets the test environment (database, secrets, admin)
      - name: Tests with coverage
        run: npm run test:coverage

      # The --ignore globs mirror coverage.exclude in backend/vitest.config.ts:
      # keep both lists in sync, or excluded files will count as 0% here.
      - name: Delta coverage check (80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          node ../.github/scripts/delta-coverage.mjs
          --coverage coverage/coverage-final.json
          --threshold 80
          --base "$BASE_REF"
          --scope backend/src/
          --ignore 'backend/src/test/**'
          --ignore 'backend/src/index.ts'
          --ignore 'backend/src/scripts/seed.ts'
          --ignore 'backend/src/scripts/check-integrity.ts'
          --ignore 'backend/src/scripts/migration-state.ts'

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # A new advisory is fixed by an upgrade or an override, never by lowering
      # the threshold.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # tsconfig.json only holds project references ("files": []): without -b,
      # tsc checks no file at all. Both referenced projects set noEmit.
      - name: TypeScript check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Hidden source maps tell the bundle budget which modules each chunk holds.
      # They do not change the emitted JavaScript, and the Docker image build
      # (plain `npm run build`) does not produce them.
      - name: Build
        run: npm run build -- --sourcemap hidden

      # Budget: 132.74 kB gzip measured on 2026-10-11 (entry + modulepreload
      # chunks) + ~5% margin. Raise it only with a reason written in the PR.
      # History: 133 kB (D-14, 126.31 kB measured); 140 kB (E-11: the public
      # pages now use TanStack's useQuery, plus skeletons, error states and
      # section navigation).
      - name: Bundle budget (initial load of the public menu)
        run: node ../.github/scripts/bundle-budget.mjs dist 140

      # Safari and iOS before 16.4 ignore media queries in range syntax (E-36).
      - name: CSS media queries readable by Safari 16
        run: node ../.github/scripts/css-media-ranges.mjs dist

      - name: Tests with coverage
        run: npm run test:coverage

      # The --ignore globs mirror coverage.exclude in frontend/vitest.config.ts:
      # keep both lists in sync, or excluded files will count as 0% here.
      - name: Delta coverage check (80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          node ../.github/scripts/delta-coverage.mjs
          --coverage coverage/coverage-final.json
          --threshold 80
          --base "$BASE_REF"
          --scope frontend/src/
          --ignore 'frontend/src/test/**'
          --ignore 'frontend/src/main.tsx'
          --ignore 'frontend/src/i18n/**'
          --ignore 'frontend/src/types/**'

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # Builds both images without pushing them, so a broken Dockerfile fails the
  # pull request instead of the release. The release workflow reads the cache
  # scope written here, and writes its own (<service>-release). Builds amd64
  # only: the arm64 part that can break is built by the docker-arm64 job below.
  # Only pushes write the cache: pull requests read the cache of their base
  # branch, and writing their own layers would evict it (10 GB quota).
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          # The backend image holds the release notes (in-app upgrade guide)
          build-contexts: ${{ matrix.service == 'backend' && 'releases=./docs/releases' || '' }}
          push: false
          # The image is not used afterwards: keep the result in the build cache only
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}

  # Builds the arm64 runtime dependencies of the backend (stage prod-deps) under
  # QEMU, as the release does. That stage runs npm ci, the Prisma generation and
  # the native module checks on the target platform: it is the part of the arm64
  # image that the amd64 build cannot test (the other arm64 steps copy files or
  # install tini). Runs on every push, not only when the backend dependencies
  # change: the base image tag also moves with Node patch releases. When nothing
  # changed, every layer comes from the cache.
  docker-arm64:
    name: Docker build (backend arm64 dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reads the arm64 layers of the last push (backend-arm64) and of the last
      # release (backend-release); writes on pushes only, as above.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: prod-deps
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=backend-arm64
            type=gha,scope=backend-release
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend-arm64' || '' }}
