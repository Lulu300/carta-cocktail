# Categories of the pull request list in generated release notes (task D-07).
#
# Read by GitHub's "generate release notes" API, which the "Create GitHub
# Release" job of .github/workflows/release.yml calls. Not to be confused with
# that workflow file.
#
# A pull request goes into the first category whose labels it carries. PR
# titles follow the plan format (`A-02: ...`), not Conventional Commits, so
# labels are the only way to sort them. GitHub's default labels (bug,
# enhancement, documentation) count as aliases of fix, feature and docs.
changelog:
  exclude:
    labels:
      # For pull requests that bring nothing new to a release, such as the
      # develop -> main merge.
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [fix, bug]
    - title: Dependencies
      labels: [dependencies]
    - title: CI
      labels: [ci]
    - title: Documentation
      labels: [docs, documentation]
    - title: Other changes
      labels: ["*"]
