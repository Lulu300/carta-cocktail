# Security headers of every response served by nginx (SPA, assets, proxied API and photos).
# Included at server level and again in each location that has its own add_header or
# proxy_hide_header: a location that defines any of them drops all the inherited ones.

# The backend (helmet) sends its own values of some of these headers: hide them so that each
# response carries a single value, the one below.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

# img-src data: is needed by the emoji favicon (data:image/svg+xml), blob: by the photo preview
# of the cocktail form.
# $frame_ancestors and $x_frame_options (nginx.conf.template) are 'none' and DENY on every
# response, except a /menu/ page when the admin listed sites allowed to embed the menu: the CSP
# then names them and X-Frame-Options is left out (an empty value sends no header), since
# DENY would block the iframe whatever frame-ancestors says.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $frame_ancestors" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $x_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS only when TLS is terminated in front of this container (reverse proxy), never on plain HTTP.
# add_header Strict-Transport-Security "max-age=31536000" always;
