<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8D%B8%3C%2Ftext%3E%3C%2Fsvg%3E"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="color-scheme" content="dark" />
    <!-- Sets the light theme of a guest who chose it before the first paint (a file: the CSP forbids inline scripts) -->
    <script src="/theme-init.js"></script>
    <meta name="description" content="Cocktail menu" />
    <title>Carta Cocktail</title>
    <style>
      /* Shown until React mounts: the page in the guest's theme, with a small spinner, instead of a flash */
      body {
        margin: 0;
        background: #0f0f1a;
        color: #f3f4f6;
      }
      :root[data-theme='light'] body {
        background: #faf7f2;
        color: #111827;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .boot::after {
        content: '';
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 3px solid #2a2a3e;
        border-top-color: #fbbf24;
        animation: boot-spin 0.8s linear infinite;
      }
      :root[data-theme='light'] .boot::after {
        border-color: #e5e7eb;
        border-top-color: #92400e;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"></div></div>
    <noscript>
      <p style="padding: 1rem; text-align: center">
        Please enable JavaScript to see the menu. / Activez JavaScript pour voir la carte.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
